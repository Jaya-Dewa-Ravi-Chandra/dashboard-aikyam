name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes (Cron format: minute hour day month weekday)
    - cron: '1-59/10 * * * *'
  workflow_dispatch: # Allows you to manually trigger it from GitHub if needed

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Server
        run: |
          curl -s https://dashboard-aikyam.onrender.com